<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>얌얌랜드 마블 핀볼 관리자</title><link rel="stylesheet" href="styles.css?v=22000">

</nav><span>방 <b id="roomCode">YAMYAM</b> · <i id="conn">연결 중</i></span></header><main><section class="stage"><div class="statusBar"><span id="modeBadge">단체 핀볼</span><span id="winBadge">당첨: 첫 번째</span><span id="mapBadge">캔디 수레바퀴</span></div><canvas id="raceCanvas"></canvas><div class="miniMapWrap"><b>MINI MAP</b><canvas id="minimapCanvas"></canvas><span id="sectionLabel">출발 구간</span></div><aside><h3 aria-hidden="true"></h3><div id="rankList" aria-label="공 순서 목록"></div></aside><div id="counter">0 / 0</div><div id="winnerCard"><div class="winnerFlash" aria-hidden="true"></div><div class="winnerSparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="winnerCrown" aria-hidden="true"></div><small>WINNER</small><strong id="winnerNames"></strong></div></section><section class="panel"><div class="group modeGroup"><input id="titleInput" value="Yamyam Marble Pinball"><button id="saveTitle">저장</button></div><div class="group inputGroup"><input id="nameInput" placeholder="닉네임"><input id="countInput" type="number" min="1" value="1"><button id="addBtn">추가</button><textarea id="bulkInput" placeholder="이름을 쉼표나 엔터로 구분해서 넣어주세요"></textarea><button id="bulkBtn">일괄 추가</button><button id="shuffleBtn" class="shuffle">🎲 추가된 공 배치 섞기</button></div><div class="group win"><b>당첨 기준</b><label class="winChoice"><input type="radio" name="win" value="first"> 첫 번째</label><label class="winChoice"><input type="radio" name="win" value="last"> 마지막</label><label class="winChoice"><input type="radio" name="win" value="number"> 숫자 선택</label><input id="rankNumber" value="3" placeholder="예: 3 또는 1,5,10"><button id="applyWin">적용</button><span id="winSaved">설정 저장 전</span></div><div class="group actionGroup"><select id="mapSelect"><option value="wheel">🍭 캔디 수레바퀴</option><option value="greed">🏺 욕망의 항아리 REMIX</option></select><button id="startBtn" class="primary">▶ 레이스 시작</button><button id="pauseBtn">⏸ 일시정지</button><button id="resetBtn">경기 초기화</button><button id="cle
